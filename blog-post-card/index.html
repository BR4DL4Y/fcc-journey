<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="blog-post-card">
    <img  class="post-img" src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="photo of code">

<div class="post-content">
    <h2 class="post-title">Congratulations!</h2>
    <p class="post-excerpt">You just won 100k dollars!</p>
    <a href="https://www.example.com/" target="_blank" class="read-more">Read More</a>
</div>
</div>
</body>
</html>
