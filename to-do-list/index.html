<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Styled To-Do List</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
<ul class="todo-list">
    <li>
        <input type="checkbox" value="gym" id="gym">
        <label for="gym">Go to the gym</label>
        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="/" target="_blank">here</a>
            </li>
        </ul>
    </li>
    <li>
        <input type="checkbox" value="shower" id="shower">
        <label for="shower">take a shower</label>
        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="/" target="_blank">here</a>
            </li>
        </ul>
    </li>
    <li>
        <input type="checkbox" value="study" id="study">
        <label for="study">Study session</label>
        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="/" target="_blank">here</a>
            </li>
        </ul>
    </li>
    <li>
        <input type="checkbox" value="sleep" id="sleep">
        <label for="sleep">Sleep 8 hours</label>
        <ul class="sub-item">
            <li>
                <a class="sub-item-link" href="/" target="_blank">here</a>
            </li>
        </ul>
    </li>
</ul>

</body>

</html>
