<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feature Selection</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <h1>Feature Selection</h1>

  <div class="feature-card-container">
  
    <!-- card 1 -->
    <label class="feature-card">
      <div>
        <strong>Cloud Storage</strong>
        <p>100 Gigabyte secure storage</p>
      </div>
      <input type="checkbox" name="feature1" value="option1">
    </label>
    
    <!-- card 2 -->
    <label class="feature-card">
      <div>
        <strong>Advanced Analytics</strong>
        <p>Insights & reports</p>
      </div>
      <input type="checkbox" name="feature2" value="option2">
    </label>
  
    <!-- card 3 -->
    <label class="feature-card">
      <div>
        <strong>Multi-User Collab</strong>
        <p>Team access and sharing</p>
      </div>
      <input type="checkbox" name="feature3" value="option3">
    </label>
  
  </div>

</body>
</html>
