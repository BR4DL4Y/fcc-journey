<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playing Cards</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>
<main id="playing-cards">
  <!-- red -->
  <div class="card red">
    <div class="left">
      <span>A</span>
      <span>♥</span>
    </div>
  <div class="middle">
    <span>♥</span>
    <span>♥</span>
  </div>
    <div class="right">
      <span>A</span>
      <span>♥</span>
    </div>
  </div>

  <!-- spade -->
  <div class="card black">
    <div class="left">
      <span>K</span>
      <span>♠</span>
    </div>
    <div class="middle">
      <span>♠</span>
      <span>♠</span>
    </div>
      <div class="right">
        <span>K</span>
        <span>♠</span>
      </div>
    </div>

  <!-- Diamond -->
  <div class="card orange">
    <div class="left">
      <span>10</span>
      <span>♦</span>
    </div>
    <div class="middle">
      <span>♦</span>
      <span>♦</span>
    </div>
    <div class="right">
      <span>10</span>
      <span>♦</span>
    </div>
    </div>
</main>
</body>

</html>
